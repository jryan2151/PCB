<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Canciones</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #a78bfa 0%, #7c3aed 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: white;
            border-radius: 30px;
            padding: 40px 52px;
            max-width: 880px;
            width: 100%;
            box-shadow: 0 30px 100px rgba(0,0,0,0.4);
        }

        /* ── Tabs ── */
        .tabs {
            display: flex;
            border-bottom: 2px solid #e9d5ff;
            margin-bottom: 30px;
            gap: 4px;
        }

        .tab {
            flex: 1;
            padding: 10px 10px;
            border: none;
            background: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.88em;
            font-weight: 700;
            color: #c4b5fd;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
            text-align: center;
            line-height: 1.3;
            border-radius: 8px 8px 0 0;
        }

        .tab:hover { color: #7c3aed; background: #faf5ff; }

        .tab.active {
            color: #7c3aed;
            border-bottom-color: #7c3aed;
            background: #faf5ff;
        }

        /* ── Title ── */
        h1 {
            text-align: center;
            color: #5b21b6;
            font-size: 2.4em;
            margin-bottom: 28px;
            letter-spacing: -0.5px;
        }

        /* ── Song display ── */
        #song {
            font-size: 1.9em;
            line-height: 2.4;
            text-align: center;
            margin-bottom: 26px;
        }

        .line { display: block; }
        .w    { display: inline-block; margin: 0 2px; }

        .blank {
            color: #d1d5db;
            font-family: monospace;
            letter-spacing: 3px;
        }

        .found { color: #5b21b6; font-weight: 700; }
        .dim   { color: #d1d5db; }

        .fresh {
            color: #10b981;
            font-weight: 700;
            animation: pop 0.55s ease forwards;
        }

        @keyframes pop {
            0%   { transform: scale(1); }
            45%  { transform: scale(1.5); }
            100% { transform: scale(1); color: #5b21b6; }
        }

        .punct { color: #9ca3af; }

        /* ── Counter ── */
        #counter {
            text-align: center;
            color: #9ca3af;
            font-size: 1em;
            margin-bottom: 22px;
        }
        #counter b { color: #7c3aed; }

        /* ── Input ── */
        .input-row {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        #wordInput {
            font-size: 1.5em;
            padding: 14px 26px;
            border: 3px solid #e9d5ff;
            border-radius: 50px;
            outline: none;
            font-family: inherit;
            color: #374151;
            width: 300px;
            text-align: center;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        #wordInput:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 5px rgba(124,58,237,0.12);
        }
        #wordInput.shake {
            border-color: #ef4444 !important;
            box-shadow: none !important;
            animation: shake 0.35s ease;
        }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25%      { transform: translateX(-9px); }
            75%      { transform: translateX(9px); }
        }

        /* ── Buttons ── */
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 50px;
            font-size: 1.45em;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: opacity 0.15s, transform 0.1s;
        }
        .btn:hover  { opacity: 0.88; }
        .btn:active { transform: scale(0.96); }
        .btn-purple { background: #7c3aed; color: white; }
        .btn-green  { background: #10b981; color: white; }
        .btn-gray   { background: #f3f4f6; color: #6b7280; }
        .btn-light  { background: #e9d5ff; color: #5b21b6; }
        .btn-sm     { font-size: 0.95em !important; padding: 10px 20px !important; }

        /* ── Feedback ── */
        #msg {
            text-align: center;
            min-height: 32px;
            margin-top: 14px;
            font-size: 1.15em;
            font-weight: 600;
        }
        .good { color: #10b981; }
        .bad  { color: #ef4444; }
        .done { color: #5b21b6; font-size: 1.35em !important; }

        /* ── Chips ── */
        #chips {
            margin-top: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .chip {
            background: #f0fdf4;
            border: 1.5px solid #a7f3d0;
            color: #065f46;
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 0.88em;
        }

        /* ── Bottom buttons ── */
        #bottomBtns {
            margin-top: 18px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="tabs">
        <button class="tab active" id="tab0" onclick="switchSong(0)">Mi Gran Amigo</button>
        <button class="tab"        id="tab1" onclick="switchSong(1)">Voy a ser valiente</button>
        <button class="tab"        id="tab2" onclick="switchSong(2)">Amad a otros</button>
    </div>

    <h1 id="title">🎵 Mi Gran Amigo</h1>
    <div id="song"></div>
    <div id="counter"></div>

    <div class="input-row">
        <input type="text" id="wordInput"
            placeholder="escribe una palabra…"
            autocomplete="off" autocorrect="off"
            autocapitalize="none" spellcheck="false"
            onkeydown="if(event.key==='Enter') submit()">
        <button class="btn btn-purple" id="submitBtn" onclick="submit()">→</button>
    </div>

    <div id="msg"></div>
    <div id="chips"></div>

    <div id="bottomBtns">
        <button class="btn btn-gray btn-sm"  id="revealBtn" onclick="revealOrSkip()">Revelar todas →</button>
        <button class="btn btn-light btn-sm" id="backBtn"   onclick="showLyrics()">↩ Ver letra</button>
    </div>
</div>

<script>
/* ═══════════════════════════════════════════
   DATOS DE LAS CANCIONES
═══════════════════════════════════════════ */
const SONGS = [
  {
    title: "Mi Gran Amigo",
    lines: [
      { words: ["Mi","gran","amigo","es","mi","papá"],    punct: ",", hide: [2,5] },
      { words: ["y","ayudarle","es","un","placer"],        punct: ".", hide: [1,4] },
      { words: ["Es","fácil","ver","que","como","él"],     punct: "",  hide: [1,5] },
      { words: ["yo","trataré","de","ser"],                punct: ".", hide: [1,3] },
      { words: ["Me","enseña","que","la","honradez"],      punct: "",  hide: [1,4] },
      { words: ["es","siempre","lo","mejor"],              punct: ".", hide: [1,3] },
      { words: ["Feliz","yo","soy","con","mi","papá"],     punct: ",", hide: [0,2] },
      { words: ["y","disfruto","de","su","amor"],          punct: ".", hide: [1,4] },
    ]
  },
  {
    title: "Voy a ser valiente",
    lines: [
      { words: ["Valientes","siervos","busca"],                              punct: "",  hide: [0,1] },
      { words: ["para","Su","obra","nuestro","Señor"],                       punct: ",", hide: [3,4] },
      { words: ["que","por","Sus","preceptos","los","guíe"],                  punct: "",  hide: [3,5] },
      { words: ["y","sirvan","a","Su","pueblo","con","amor"],                 punct: ".", hide: [4,6] },
      { words: ["Voy","a","ser","Su","siervo"],                              punct: "",  hide: [0,4] },
      { words: ["y","mis","convenios","observar"],                            punct: ".", hide: [2,3] },
      { words: ["Defenderé","la","rectitud"],                                 punct: "",  hide: [0,2] },
      { words: ["y","en","mí","Él","podrá","confiar"],                       punct: ".", hide: [4,5] },
    ]
  },
  {
    title: "Amad a otros",
    lines: [
      { words: ["Como","os","he","amado,","amad","a","otros"],  punct: ".", hide: [4,6] },
      { words: ["Un","nuevo","mandamiento,","amad","a","otros"], punct: ".", hide: [3,5] },
      { words: ["Por","esto","sabrán","que","sois","discípulos","míos"], punct: ",", hide: [2,5] },
      { words: ["si","os","amáis","unos","a","otros"],           punct: ".", hide: [2,5] },
    ]
  }
];

/* ═══════════════════════════════════════════
   ESTADO GLOBAL
═══════════════════════════════════════════ */
function norm(s) {
    return s.toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z]/g, '');
}

let currentSong = 0;
let SONG_DATA   = SONGS[0].lines;
let TOKENS      = buildTokens(SONG_DATA);

let mode       = 'lyrics';
let phraseIdx  = 0;
let phraseFound= new Set();
let msgTimer   = null;
let guessedKeys  = new Set();
let guessedWords = [];

function buildTokens(data) {
    let id = 0;
    return data.map((line, li) =>
        line.words.map((w, wi) => ({
            id: id++, word: w, key: norm(w),
            revealed: false, li, wi,
            isLast: wi === line.words.length - 1
        }))
    );
}

/* ═══════════════════════════════════════════
   CAMBIO DE CANCIÓN
═══════════════════════════════════════════ */
function switchSong(idx) {
    currentSong  = idx;
    SONG_DATA    = SONGS[idx].lines;
    TOKENS       = buildTokens(SONG_DATA);
    guessedKeys  = new Set();
    guessedWords = [];
    mode         = 'lyrics';
    phraseIdx    = 0;

    document.querySelectorAll('.tab').forEach((t, i) => {
        t.className = 'tab' + (i === idx ? ' active' : '');
    });
    document.getElementById('title').textContent = '🎵 ' + SONGS[idx].title;

    showLyrics();
}

/* ═══════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════ */
function setMsg(text, cls, autoClear = true) {
    clearTimeout(msgTimer);
    const el = document.getElementById('msg');
    el.className = cls;
    el.textContent = text;
    if (autoClear) msgTimer = setTimeout(() => { el.textContent = ''; }, 2600);
}

function blankFor(word) {
    return '_'.repeat(norm(word).length || word.length);
}

function submit()      { if (mode === 'game')   guess();     if (mode === 'phrase') guessPhrase(); }
function revealOrSkip(){ if (mode === 'game')   revealAll(); if (mode === 'phrase') skipPhrase();  }

/* ═══════════════════════════════════════════
   FASE 1 · Letra completa
═══════════════════════════════════════════ */
function showLyrics() {
    mode = 'lyrics';

    document.getElementById('song').innerHTML =
        SONG_DATA.map(line =>
            `<span class="line found">${line.words.join(' ')}` +
            (line.punct ? `<span class="punct">${line.punct}</span>` : '') +
            `</span>`
        ).join('');

    document.getElementById('counter').innerHTML = '📖 Lee la canción y memorízala';
    document.getElementById('wordInput').style.display = 'none';
    document.getElementById('submitBtn').style.display = 'none';
    document.getElementById('msg').textContent = '';
    document.getElementById('chips').innerHTML = '';
    document.getElementById('revealBtn').style.display = 'none';

    const back = document.getElementById('backBtn');
    back.textContent = '¡Empezar el juego! →';
    back.className = 'btn btn-purple btn-sm';
    back.setAttribute('onclick', 'startGame()');
    back.style.display = '';
}

/* ═══════════════════════════════════════════
   FASE 2 · Adivina las palabras
═══════════════════════════════════════════ */
function startGame() {
    mode = 'game';
    TOKENS.flat().forEach(t => { t.revealed = false; });
    guessedKeys  = new Set();
    guessedWords = [];

    document.getElementById('wordInput').style.display = '';
    document.getElementById('wordInput').disabled = false;
    document.getElementById('wordInput').value = '';
    document.getElementById('submitBtn').style.display = '';
    document.getElementById('chips').innerHTML = '';

    const rev = document.getElementById('revealBtn');
    rev.textContent = 'Revelar todas →';
    rev.className = 'btn btn-gray btn-sm';
    rev.setAttribute('onclick', 'revealOrSkip()');
    rev.style.display = '';

    const back = document.getElementById('backBtn');
    back.textContent = '↩ Ver letra';
    back.className = 'btn btn-light btn-sm';
    back.setAttribute('onclick', 'showLyrics()');
    back.style.display = '';

    renderGame();
    document.getElementById('wordInput').focus();
}

function renderGame(freshIds = new Set()) {
    let html = '';
    TOKENS.forEach((lineTokens, li) => {
        html += '<span class="line">';
        lineTokens.forEach(tok => {
            if (tok.revealed) {
                html += `<span class="${freshIds.has(tok.id) ? 'w fresh' : 'w found'}">${tok.word}</span>`;
            } else {
                html += `<span class="w blank">${blankFor(tok.word)}</span>`;
            }
            if (tok.isLast && SONG_DATA[li].punct)
                html += `<span class="punct">${SONG_DATA[li].punct}</span>`;
        });
        html += '</span>';
    });
    document.getElementById('song').innerHTML = html;

    if (freshIds.size) {
        setTimeout(() => {
            document.querySelectorAll('.fresh').forEach(el => el.className = 'w found');
        }, 650);
    }

    const flat = TOKENS.flat();
    const rev  = flat.filter(t => t.revealed).length;
    document.getElementById('counter').innerHTML =
        `Palabras encontradas: <b>${rev}</b> de ${flat.length}`;
    document.getElementById('chips').innerHTML =
        guessedWords.map(w => `<span class="chip">✓ ${w}</span>`).join('');
}

function guess() {
    const inp  = document.getElementById('wordInput');
    const word = inp.value.trim();
    if (!word) { inp.focus(); return; }

    const key = norm(word);
    if (guessedKeys.has(key)) {
        setMsg(`"${word}" ya la dijiste 😉`, 'bad');
        inp.value = ''; inp.focus(); return;
    }

    const freshIds = new Set();
    TOKENS.flat().forEach(tok => {
        if (tok.key === key) { tok.revealed = true; freshIds.add(tok.id); }
    });

    if (freshIds.size) {
        guessedKeys.add(key);
        guessedWords.push(word.toLowerCase());
        const n = freshIds.size;
        setMsg(n > 1 ? `¡Sí! "${word}" aparece ${n} veces 🎉` : `¡Sí! "${word}" está en la canción ✓`, 'good');
        renderGame(freshIds);

        if (TOKENS.flat().every(t => t.revealed)) {
            clearTimeout(msgTimer);
            document.getElementById('wordInput').disabled = true;
            const rev = document.getElementById('revealBtn');
            rev.textContent = '¡Frase por frase! →';
            rev.className = 'btn btn-green btn-sm';
            rev.setAttribute('onclick', 'startPhraseGame()');
            setTimeout(() => setMsg('🎉 ¡Completaron todo! Ahora frase por frase 🎵', 'done', false), 600);
        }
    } else {
        setMsg(`"${word}" no está en la canción ✗`, 'bad');
        inp.classList.add('shake');
        setTimeout(() => inp.classList.remove('shake'), 400);
    }

    inp.value = '';
    inp.focus();
}

function revealAll() {
    TOKENS.flat().forEach(t => { t.revealed = true; });
    renderGame();
    document.getElementById('wordInput').disabled = true;
    const rev = document.getElementById('revealBtn');
    rev.textContent = '¡Frase por frase! →';
    rev.className = 'btn btn-green btn-sm';
    rev.setAttribute('onclick', 'startPhraseGame()');
    setMsg('🎵 ¡Ahora vamos frase por frase!', 'done', false);
}

/* ═══════════════════════════════════════════
   FASE 3 · Frase por frase
═══════════════════════════════════════════ */
function startPhraseGame() {
    mode = 'phrase';
    phraseIdx = 0;
    document.getElementById('chips').innerHTML = '';
    document.getElementById('backBtn').style.display = 'none';
    renderPhrase();
}

function renderPhrase() {
    if (phraseIdx >= SONG_DATA.length) { showFinalSing(); return; }

    phraseFound = new Set();
    const line   = SONG_DATA[phraseIdx];
    const hidden = new Set(line.hide);

    let html = '';
    for (let i = 0; i < phraseIdx; i++) {
        const p = SONG_DATA[i];
        html += `<span class="line dim">${p.words.join(' ')}${p.punct}</span>`;
    }

    html += '<span class="line">';
    line.words.forEach((w, i) => {
        if (hidden.has(i)) {
            html += `<span class="w blank" id="ph-${i}">${blankFor(w)}</span> `;
        } else {
            html += `<span class="w found">${w}</span> `;
        }
    });
    if (line.punct) html += `<span class="punct">${line.punct}</span>`;
    html += '</span>';

    document.getElementById('song').innerHTML = html;
    document.getElementById('counter').innerHTML =
        `🎤 Frase ${phraseIdx + 1} de ${SONG_DATA.length} · ¡Di las palabras que faltan!`;
    document.getElementById('msg').textContent = '';
    document.getElementById('wordInput').style.display = '';
    document.getElementById('wordInput').disabled = false;
    document.getElementById('wordInput').value = '';
    document.getElementById('submitBtn').style.display = '';

    const rev = document.getElementById('revealBtn');
    rev.textContent = 'Revelar frase →';
    rev.className = 'btn btn-gray btn-sm';
    rev.setAttribute('onclick', 'revealOrSkip()');
    rev.style.display = '';

    document.getElementById('wordInput').focus();
}

function guessPhrase() {
    const inp  = document.getElementById('wordInput');
    const word = inp.value.trim();
    if (!word) { inp.focus(); return; }

    const line     = SONG_DATA[phraseIdx];
    const typedKey = norm(word);
    let found = false;

    line.hide.forEach(wi => {
        if (!phraseFound.has(wi) && norm(line.words[wi]) === typedKey) {
            phraseFound.add(wi);
            found = true;
            const el = document.getElementById(`ph-${wi}`);
            if (el) {
                el.textContent = line.words[wi];
                el.className = 'w fresh';
                setTimeout(() => { el.className = 'w found'; }, 650);
            }
        }
    });

    if (found) {
        const rem = line.hide.length - phraseFound.size;
        if (rem === 0) phraseComplete();
        else setMsg(`¡Bien! Falta${rem > 1 ? 'n' : ''} ${rem} más`, 'good');
    } else {
        setMsg(`"${word}" no es ninguna de las que faltan`, 'bad');
        inp.classList.add('shake');
        setTimeout(() => inp.classList.remove('shake'), 400);
    }

    inp.value = '';
    inp.focus();
}

function skipPhrase() {
    const line = SONG_DATA[phraseIdx];
    line.hide.forEach(wi => {
        if (!phraseFound.has(wi)) {
            phraseFound.add(wi);
            const el = document.getElementById(`ph-${wi}`);
            if (el) { el.textContent = line.words[wi]; el.className = 'w found'; }
        }
    });
    phraseComplete();
}

function phraseComplete() {
    clearTimeout(msgTimer);
    setMsg('🎵 ¡Cántenla! 🎶', 'done', false);
    document.getElementById('wordInput').disabled = true;
    const rev = document.getElementById('revealBtn');
    rev.textContent = phraseIdx < SONG_DATA.length - 1 ? 'Siguiente frase →' : '¡Cantemos toda la canción! →';
    rev.className = 'btn btn-purple btn-sm';
    rev.setAttribute('onclick', 'nextPhrase()');
}

function nextPhrase() { phraseIdx++; renderPhrase(); }

/* ═══════════════════════════════════════════
   FINAL · Cantar juntos
═══════════════════════════════════════════ */
function showFinalSing() {
    mode = 'lyrics';
    document.getElementById('song').innerHTML =
        SONG_DATA.map(line =>
            `<span class="line found">${line.words.join(' ')}` +
            (line.punct ? `<span class="punct">${line.punct}</span>` : '') +
            `</span>`
        ).join('');

    document.getElementById('counter').innerHTML = '🎶 ¡Cantemos toda la canción juntos!';
    document.getElementById('wordInput').style.display = 'none';
    document.getElementById('submitBtn').style.display = 'none';
    document.getElementById('revealBtn').style.display = 'none';
    document.getElementById('chips').innerHTML = '';
    setMsg('🎉🎵 ¡Muy bien! ¡Lo lograron todos! 🎊', 'done', false);

    const back = document.getElementById('backBtn');
    back.textContent = '↩ Empezar de nuevo';
    back.className = 'btn btn-light btn-sm';
    back.setAttribute('onclick', 'showLyrics()');
    back.style.display = '';
}

/* Arrancar */
showLyrics();
</script>
</body>
</html>
