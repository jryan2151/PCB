<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Mi Gran Amigo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #a78bfa 0%, #7c3aed 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: white;
            border-radius: 30px;
            padding: 48px 56px;
            max-width: 860px;
            width: 100%;
            box-shadow: 0 30px 100px rgba(0,0,0,0.4);
        }

        h1 {
            text-align: center;
            color: #5b21b6;
            font-size: 2.6em;
            margin-bottom: 36px;
            letter-spacing: -0.5px;
        }

        /* ── Song ── */
        #song {
            font-size: 2em;
            line-height: 2.4;
            text-align: center;
            margin-bottom: 28px;
        }

        .line { display: block; }

        .w {
            display: inline-block;
            margin: 0 2px;
        }

        .blank {
            color: #d1d5db;
            font-family: monospace;
            letter-spacing: 3px;
        }

        .found {
            color: #5b21b6;
            font-weight: 700;
        }

        .fresh {
            color: #10b981;
            font-weight: 700;
            animation: pop 0.55s ease forwards;
        }

        @keyframes pop {
            0%   { transform: scale(1); }
            45%  { transform: scale(1.5); }
            100% { transform: scale(1); color: #5b21b6; }
        }

        .punct { color: #9ca3af; }

        /* ── Counter ── */
        #counter {
            text-align: center;
            color: #9ca3af;
            font-size: 1.05em;
            margin-bottom: 24px;
        }
        #counter b { color: #7c3aed; font-size: 1.1em; }

        /* ── Input row ── */
        .input-row {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        #wordInput {
            font-size: 1.6em;
            padding: 15px 28px;
            border: 3px solid #e9d5ff;
            border-radius: 50px;
            outline: none;
            font-family: inherit;
            color: #374151;
            width: 320px;
            text-align: center;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #wordInput:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 5px rgba(124,58,237,0.12);
        }

        #wordInput.shake {
            border-color: #ef4444 !important;
            box-shadow: none !important;
            animation: shake 0.35s ease;
        }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25%      { transform: translateX(-9px); }
            75%      { transform: translateX(9px); }
        }

        .btn-go {
            padding: 15px 30px;
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.5em;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
        }
        .btn-go:hover  { opacity: 0.88; }
        .btn-go:active { transform: scale(0.96); }

        /* ── Feedback ── */
        #msg {
            text-align: center;
            min-height: 34px;
            margin-top: 16px;
            font-size: 1.2em;
            font-weight: 600;
        }
        .good { color: #10b981; }
        .bad  { color: #ef4444; }
        .done { color: #5b21b6; font-size: 1.5em !important; }

        /* ── Used word chips ── */
        #chips {
            margin-top: 18px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .chip {
            background: #f0fdf4;
            border: 1.5px solid #a7f3d0;
            color: #065f46;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>🎵 Mi Gran Amigo</h1>
    <div id="song"></div>
    <div id="counter"></div>
    <div class="input-row">
        <input type="text" id="wordInput"
            placeholder="escribe una palabra…"
            autocomplete="off" autocorrect="off"
            autocapitalize="none" spellcheck="false"
            onkeydown="if(event.key==='Enter') guess()">
        <button class="btn-go" onclick="guess()">→</button>
    </div>
    <div id="msg"></div>
    <div id="chips"></div>
    <div style="text-align:center; margin-top:20px;">
        <button class="btn-go" style="font-size:1em; padding:10px 22px; background:#e9d5ff; color:#5b21b6;" onclick="showLyrics()">↩ Ver letra</button>
    </div>
</div>

<script>
const SONG_DATA = [
    { words: ["Mi","gran","amigo","es","mi","papá"],   punct: "," },
    { words: ["y","ayudarle","es","un","placer"],       punct: "." },
    { words: ["Es","fácil","ver","que","como","él"],    punct: "" },
    { words: ["yo","trataré","de","ser"],               punct: "." },
    { words: ["Me","enseña","que","la","honradez"],     punct: "" },
    { words: ["es","siempre","lo","mejor"],             punct: "." },
    { words: ["Feliz","yo","soy","con","mi","papá"],    punct: "," },
    { words: ["y","disfruto","de","su","amor"],         punct: "." },
];

function norm(s) {
    return s.toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z]/g, '');
}

/* Build flat token list */
let _id = 0;
const TOKENS = SONG_DATA.map((line, li) =>
    line.words.map((w, wi) => ({
        id: _id++, word: w, key: norm(w),
        revealed: false, li, wi,
        isLast: wi === line.words.length - 1
    }))
);

const guessedKeys  = new Set();
const guessedWords = [];
let msgTimer = null;

function render(freshIds = new Set()) {
    /* Song HTML */
    let html = '';
    TOKENS.forEach((lineTokens, li) => {
        html += '<span class="line">';
        lineTokens.forEach(tok => {
            if (tok.revealed) {
                const cls = freshIds.has(tok.id) ? 'w fresh' : 'w found';
                html += `<span class="${cls}">${tok.word}</span>`;
            } else {
                html += `<span class="w blank">${'_'.repeat(tok.word.length)}</span>`;
            }
            if (tok.isLast && SONG_DATA[li].punct)
                html += `<span class="punct">${SONG_DATA[li].punct}</span>`;
        });
        html += '</span>';
    });
    document.getElementById('song').innerHTML = html;

    /* After pop animation ends, switch class to avoid re-triggering */
    if (freshIds.size) {
        setTimeout(() => {
            document.querySelectorAll('.fresh').forEach(el => {
                el.className = 'w found';
            });
        }, 650);
    }

    /* Counter */
    const flat     = TOKENS.flat();
    const total    = flat.length;
    const revealed = flat.filter(t => t.revealed).length;
    document.getElementById('counter').innerHTML =
        `Palabras encontradas: <b>${revealed}</b> de ${total}`;

    /* Chips */
    document.getElementById('chips').innerHTML =
        guessedWords.map(w => `<span class="chip">✓ ${w}</span>`).join('');
}

function setMsg(text, cls, autoClear = true) {
    clearTimeout(msgTimer);
    const el = document.getElementById('msg');
    el.className = cls;
    el.textContent = text;
    if (autoClear) msgTimer = setTimeout(() => el.textContent = '', 2600);
}

function guess() {
    const inp  = document.getElementById('wordInput');
    const word = inp.value.trim();
    if (!word) { inp.focus(); return; }

    const key = norm(word);

    if (guessedKeys.has(key)) {
        setMsg(`"${word}" ya la dijiste 😉`, 'bad');
        inp.value = '';
        inp.focus();
        return;
    }

    const freshIds = new Set();
    TOKENS.flat().forEach(tok => {
        if (tok.key === key) { tok.revealed = true; freshIds.add(tok.id); }
    });

    if (freshIds.size) {
        guessedKeys.add(key);
        guessedWords.push(word.toLowerCase());

        const times = freshIds.size;
        setMsg(
            times > 1 ? `¡Sí! "${word}" aparece ${times} veces 🎉` : `¡Sí! "${word}" está en la canción ✓`,
            'good'
        );
        render(freshIds);

        if (TOKENS.flat().every(t => t.revealed)) {
            clearTimeout(msgTimer);
            setTimeout(() => setMsg('🎉🎵 ¡Completaron toda la canción! ¡Muy bien! 🎊', 'done', false), 700);
            inp.disabled = true;
        }
    } else {
        setMsg(`"${word}" no está en la canción ✗`, 'bad');
        inp.classList.add('shake');
        setTimeout(() => inp.classList.remove('shake'), 400);
    }

    inp.value = '';
    inp.focus();
}

/* ── Vista: letra completa ── */
function showLyrics() {
    const fullText = SONG_DATA.map(line =>
        line.words.join(' ') + line.punct
    ).join('\n');

    document.getElementById('song').innerHTML =
        SONG_DATA.map(line =>
            `<span class="line found">${line.words.join(' ')}` +
            (line.punct ? `<span class="punct">${line.punct}</span>` : '') +
            `</span>`
        ).join('');

    document.getElementById('counter').innerHTML = '📖 Lee la canción y memorízala';
    document.getElementById('wordInput').style.display = 'none';
    document.querySelector('.btn-go').style.display = 'none';
    document.getElementById('msg').textContent = '';
    document.getElementById('chips').innerHTML = '';

    /* Cambiar el botón "Ver letra" por "¡Empezar juego!" */
    const backBtn = document.querySelector('[onclick="showLyrics()"]');
    backBtn.textContent = '¡Empezar el juego! →';
    backBtn.style.background = '#7c3aed';
    backBtn.style.color = 'white';
    backBtn.setAttribute('onclick', 'startGame()');
}

/* ── Vista: juego ── */
function startGame() {
    /* Resetear tokens */
    TOKENS.flat().forEach(tok => tok.revealed = false);
    guessedKeys.clear();
    guessedWords.length = 0;

    document.getElementById('wordInput').style.display = '';
    document.getElementById('wordInput').disabled = false;
    document.querySelector('.btn-go').style.display = '';

    const backBtn = document.querySelector('[onclick="startGame()"]');
    backBtn.textContent = '↩ Ver letra';
    backBtn.style.background = '#e9d5ff';
    backBtn.style.color = '#5b21b6';
    backBtn.setAttribute('onclick', 'showLyrics()');

    render();
    document.getElementById('wordInput').focus();
}

/* Arrancar en la pantalla de letra */
showLyrics();
</script>
</body>
</html>
